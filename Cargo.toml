[package]
name = "brc20-command-minter"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.0.30", features = ["consensus", "network", "signers", "rlp"] }
axum = "0.8.4"
axum-server = "0.7.2"
bitcoin = { version = "0.32.7", features = ["std", "rand-std", "base64", "serde", "bitcoinconsensus-std", "bitcoinconsensus"] }
bitcoincore-rpc = "0.19.0"
brc20-prog = "0.11.0"
dotenvy = "0.15.7"
hex = "0.4.3"
http = "1.3.1"
jsonrpsee = { version = "0.25.1", features = ["http-client"] }
lazy_static = "1.5.0"
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
secp256k1 = { version = "0.31.1", features = [] }
serde = "1.0.219"
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["sqlite", "macros", "runtime-tokio"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
